# SellGUI v3 core configuration.
# GUI layout and menu filters are configured in gui.yml.

general:
  config-version: "5"
  debug: false
  check-updates: true
  close-after-sell: false
  allow-player-evaluation-stack: false
  add-worth-lore: false
  worth-lore-blacklist-gui-titles:
    - "ah"
    - "Auction House"
    - "My Chest"

economy:
  use-vault: true
  money-format: "$%.2f"
  min-transaction: 0.01
  max-transaction: 1000000.0
  tax-rate: 0.0
  round-prices: false
  places-to-round: 2
  sell-bonuses: {}

# Legacy paths still used by older parts of the plugin.
use-essentials-price: true
use-shopguiplus-price: true
places-to-round: 2
drop-items-on-close: false
log-transactions: true
sellall-show-preview: true
sell-all-command-sell-enchanted: false

items:
  custom-items: true
  mmoitems:
    enabled: true
    use-custom-prices: true
    price-multiplier: 1.0
  nexo:
    enabled: true
    use-custom-prices: true
    price-multiplier: 1.0

prices:
  nbt-pricing: true
  calculation-method: "auto" # auto, config, essentials, nbt, shopguiplus
  default-price: 0.0
  multipliers:
    enabled: true
    permission-based: true
    default-multiplier: 1.0
    max-multiplier: 5.0
  random-pricing:
    enabled: false
    variation-percent: 10.0

autosell:
  show-item-summary: true

performance:
  cache-prices: true
  cache-duration: 300
  async-calculations: true
  max-concurrent-operations: 10
  gui-update-interval: 20
  price-update-interval: 100

logging:
  enabled: true

integrations:
  placeholderapi: true
  essentials: true
  vault: true

advanced:
  show-placeholder-errors: true

settings:
  money-format: "$%.2f"
