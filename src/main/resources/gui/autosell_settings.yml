        - "&eClick to enable."
    next_page_button:
      material: "ARROW"
      custom-model-data: 0
      name: "&aNext Page"
      lore:
        - "&7Click to go to the next page."
    previous_page_button:
      material: "ARROW"
      custom-model-data: 0
      name: "&cPrevious Page"
      lore:
        - "&7Click to go to the previous page."
    enable_all_button:
      material: "LIME_CONCRETE"
      custom-model-data: 0
      name: "&a&lEnable Autosell"
      lore:
        - "&7Click to enable autosell."
    disable_all_button:
      material: "RED_CONCRETE"
      custom-model-data: 0
      name: "&c&lDisable Autosell"
      lore:
        - "&7Click to disable autosell."
    search_button:
      material: "OAK_SIGN"
      custom-model-data: 0
      name: "&a&lSearch"
      lore:
        - "&7Click to search for an item."
    no_priced_items:
      material: "BARRIER"
      custom-model-data: 0
      name: "&c&lNo Priced Items"
      lore:
        - "&7There are no items with a set price."
    filler:
      material: "GRAY_STAINED_GLASS_PANE"
      custom-model-data: 0
      name: " "
      lore: []
