example-item:
  material: "STICK"
  name: "Example Item"
  glimmer: true
  custom-model-data: 123
  # item-model: "kostka:add10_button_model"
  # hide-tool-tip: true
  # tooltip-style: "minecraft:empty"
  slot: 53
  menus:
    - "default"
    - "fishing"
  disabled: false
  sender: "console"
  lore:
    - "Example Lore"
  commands:
    - "say %player% clicked this item!"

fishing-info:
  material: "COD"
  name: "&bFishing Sell Info"
  glimmer: false
  custom-model-data: 0
  slot: 35
  menus:
    - "fishing"
  disabled: false
  lore:
    - "&7This button only appears"
    - "&7in the fishing sell menu."
  commands: []

#
# [label]: = can be anything, not used in-game
#   material: [material name] = https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#   name: "[name]" = Name of the item
#   glimmer: [boolean] = True or false, gives enchantment shimmer when true
#   custom-model-data: [number] = Custom Model Data Resource Pack of the item
#   item-model: "[namespace:key]" = Optional item model, for example "kostka:add10_button_model"
#   hide-tool-tip: [boolean] = Optional, hides the vanilla tooltip when supported by the server
#   tooltip-style: "[namespace:key]" = Optional tooltip style, for example "minecraft:empty"
#   slot: [number] = Slot of the item https://proxy.spigotmc.org/286cf93278ca679cecf2a40528fd830418b75d4a?url=http%3A%2F%2Fi.imgur.com%2FgK9plGo.png
#   menus: = Optional sell menu IDs where this item should appear. If omitted or empty, the item appears in every sell menu.
#     - "default"
#     - "fishing"
#   disabled: [boolean] = if true, the item will be replaced by the fill-item
#   sender: "console|player|op" = Command sender. Default: console. op temporarily grants OP to clicking player.
#   lore: = lore list of the item, can be empty. For no lore do "lore: " with no trailing lines of strings
#     - "[Line]"
#   commands: = Commands run using sender. Leading / is optional.
#     - "[command]"
#
